services:
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    volumes:
      - 6eek-data:/data
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  6eek-data:
