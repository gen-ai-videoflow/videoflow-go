<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/6eek-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>6eek Studio</title>
    <!--
      Apply the saved theme BEFORE first paint so dark (the default) never
      flashes light during hydration. The +layout ModeWatcher keeps this in
      sync afterwards; this inline copy only matters for the very first paint.
    -->
    <script>
      (function () {
        try {
          // Retain same-origin preferences and saved project references from the former brand.
          for (var index = 0, oldKeys = Object.keys(localStorage); index < oldKeys.length; index++) {
            var oldKey = oldKeys[index];
            if (oldKey.indexOf('videoflow.') === 0) {
              var newKey = '6eek.' + oldKey.slice(10);
              if (localStorage.getItem(newKey) === null) {
                var savedValue = localStorage.getItem(oldKey);
                localStorage.removeItem(oldKey);
                try { localStorage.setItem(newKey, savedValue); }
                catch (migrationError) { localStorage.setItem(oldKey, savedValue); }
              }
            }
          }
          var pref = localStorage.getItem('6eek.theme') || 'dark';
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
